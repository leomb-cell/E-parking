<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- css -->
    <link rel="stylesheet" href="../../static/css/meus_estacionamentos.css" />
    <link rel="stylesheet" href="../../static/css/navbar.css" />
    <link rel="stylesheet" href="../../static/css/responsivity.css" />
    <link rel="stylesheet" href="../../static/css/font.css" />
    <link rel="stylesheet" href="../../static/css/footer.css" />

    <link
      rel="shortcut icon"
      href="./static/images/icone.png"
      type="image/x-icon"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Stack+Sans+Headline:wght@200..700&display=swap"
      rel="stylesheet"
    />

    <!-- scripts -->
    <script src="../../api.js"></script>
    <script src="../../config.js"></script>
    <script src="../../static/components/navbar.js" defer></script>
    <script src="../../static/components/footer.js" defer></script>
    <script src="./edit_estacionamento.js" defer></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
      defer
    ></script>

    <title>E-Parking Florianópolis</title>
  </head>
  <body>
    <!-- Header -->
    <header>
      <!-- navbar -->
      <custom-navbar
        logo="../../static/images/icone_e_parking.png"
        cssSrc="../../static/css/navbar.css"
        base="../../"
        active="sobre"
      ></custom-navbar>
    </header>

    <!-- Conteudo principal -->

    <main id="main_container">
      <h1>Editar Estacionamento</h1>
      <div class="">
        <form id="formulario">
          <input type="hidden" id="estacionamento_id" />

          <!-- Informações Gerais -->
          <div class="mb-3">
            <label for="nome" class="form-label">Nome do Estacionamento</label>
            <input
              type="text"
              class="form-control"
              placeholder="Nome"
              id="nome"
              required
            />
          </div>

          <!-- Endereço -->
          <div>
            <div class="row">
              <div class="col mb-3">
                <label for="cep" class="form-label">CEP</label>
                <input
                  type="text"
                  class="form-control"
                  placeholder="CEP"
                  id="cep"
                  required
                />
              </div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="id_estado" class="form-label">Estado</label>
                <select class="form-control" id="id_estado">
                  <option value="" disabled selected>
                    Selecione um estado...
                  </option>
                </select>
              </div>

              <div class="col-md-6 mb-3">
                <label for="id_municipio" class="form-label">Município</label>
                <select class="form-control" id="id_municipio">
                  <option value="" disabled selected>
                    Selecione um município...
                  </option>
                </select>
              </div>
            </div>

            <div class="row">
              <div class="col-md-12 mb-3">
                <label for="bairro" class="form-label">Bairro</label>
                <input
                  type="text"
                  class="form-control"
                  placeholder="Bairro"
                  id="bairro"
                  required
                />
              </div>
            </div>

            <div class="row">
              <div class="col-md-9 mb-3">
                <label for="logradouro" class="form-label">Logradouro</label>
                <input
                  type="text"
                  class="form-control"
                  placeholder="Logradouro"
                  id="logradouro"
                  required
                />
              </div>

              <div class="col-md-3 mb-3">
                <label for="numero" class="form-label">Número</label>
                <input
                  type="text"
                  class="form-control"
                  placeholder="Número"
                  id="numero"
                  required
                />
              </div>
            </div>
          </div>

          <!-- Alvará de Funcionamento -->
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="num_alvara" class="form-label">Nº Alvará</label>
              <input
                type="text"
                class="form-control"
                placeholder="Número do Alvará"
                id="num_alvara"
                required
              />
            </div>

            <div class="col-md-6 mb-3">
              <label for="validade_alvara" class="form-label"
                >Validade do Alvará</label
              >
              <input
                type="datetime-local"
                class="form-control"
                id="validade_alvara"
                required
              />
            </div>
          </div>

          <!-- Horário de Funcionamento -->
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="hr_abertura" class="form-label"
                >Horário Abertura</label
              >
              <input
                type="time"
                class="form-control"
                id="hr_abertura"
                required
              />
            </div>

            <div class="col-md-6 mb-3">
              <label for="hr_fechamento" class="form-label"
                >Horário Fechamento</label
              >
              <input
                type="time"
                class="form-control"
                id="hr_fechamento"
                required
              />
            </div>
          </div>

          <!-- Vagas -->
          <div class="row">
            <div class="col-md-4 mb-3">
              <label for="qtd_vagas_comum" class="form-label"
                >Vagas Comuns</label
              >
              <input
                type="number"
                class="form-control"
                placeholder="Qtd. Comum"
                id="qtd_vagas_comum"
                required
              />
            </div>

            <div class="col-md-4 mb-3">
              <label for="qtd_vagas_pcd" class="form-label">Vagas PCD</label>
              <input
                type="number"
                class="form-control"
                placeholder="Qtd. PCD"
                id="qtd_vagas_pcd"
                required
              />
            </div>

            <div class="col-md-4 mb-3">
              <label for="qtd_vagas_idoso" class="form-label"
                >Vagas Idoso</label
              >
              <input
                type="number"
                class="form-control"
                placeholder="Qtd. Idoso"
                id="qtd_vagas_idoso"
                required
              />
            </div>
          </div>

          <!-- Botão de Ação -->
          <div class="row">
            <div class="col-md-6 d-flex justify-content-start">
              <button type="submit" class="btn btn-confirmar">Confirmar</button>
            </div>
            <div class="col-md-6 d-flex justify-content-end">
              <button
                type="button"
                class="btn btn-fechar"
                data-bs-dismiss="modal"
              >
                Fechar
              </button>
            </div>
          </div>
        </form>
      </div>
    </main>

    <!-- footer -->

    <custom-footer
      logo="../../static/images/icone_e_parking.png"
      cssSrc="../../static/css/footer.css"
      base="../../"
    ></custom-footer>
  </body>
</html>
